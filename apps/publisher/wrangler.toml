name = "daydan-publisher"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# رابط عام لاستقبال ضغطات زر «قرأت» من تيليجرام (webhook). كل مسار آخر يرد 404.
workers_dev = true

# 07:00 بتوقيت مكة: المنشور اليومي. 07:01: ستوري إنستغرام. وكل ربع ساعة: التذكيرات الشخصية (كلٌّ على توقيت مدينته)
[triggers]
crons = ["0 4 * * *", "1 4 * * *", "*/15 * * * *"]

[vars]
TELEGRAM_CHANNEL = "@daydanquran"
# عنوان هذا الـWorker نفسه، يُسجَّل في تيليجرام كـwebhook عند كل تشغيل مجدول
WEBHOOK_URL = "https://daydan-publisher.mohammadabdalwahed347.workers.dev/telegram/webhook"
TELEGRAM_ENABLED = "1"
PUBLISH_DRY_RUN = "1"
# مفتاح إيقاف التذكيرات. مع PUBLISH_DRY_RUN = "1" لا يصل التذكير إلا إلى ADMIN_CHAT_ID
REMINDERS_ENABLED = "1"
# 07:01: صورة ستوري اليوم تصل ADMIN_CHAT_ID على تيليجرام لتنشرها يدوياً على إنستغرام وفيسبوك.
# قبل الإطلاق تصل الصفحة ١ كل يوم بعلامة «تجربة».
STORY_KIT_ENABLED = "1"
# ستوري إنستغرام الآلي (صفحة اليوم): موقوف، فمنصة مطوّري Meta مغلقة أمام حسابنا (docs/instagram-story.md).
# INSTAGRAM_DRY_RUN = "1" يرسل للمشرف فقط ما كان سيُنشر، حتى بعد إطفاء PUBLISH_DRY_RUN.
INSTAGRAM_ENABLED = "0"
INSTAGRAM_DRY_RUN = "1"
INSTAGRAM_USER_ID = ""
# ADMIN_CHAT_ID و TELEGRAM_BOT_TOKEN و INSTAGRAM_ACCESS_TOKEN أسرار: npx wrangler secret put ...

[[kv_namespaces]]
binding = "PUBLICATIONS"
id = "b661ffa2ea7a432eb99d4cbe3490f11a"

[[d1_databases]]
binding = "DB"
database_name = "daydan"
database_id = "02417395-f611-4c24-8cd3-91a51a938149"
migrations_dir = "migrations"
