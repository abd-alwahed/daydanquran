name = "daydan-publisher"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# رابط عام لاستقبال ضغطات زر «قرأت» من تيليجرام (webhook). كل مسار آخر يرد 404.
workers_dev = true

# بتوقيت مكة: 07:00 تيليجرام، 07:05 صور إنستغرام وفيسبوك، 07:15 الفيديو والريل، 20:00 ستوري إنستغرام.
# وكل ربع ساعة: التذكيرات الشخصية (كلٌّ على توقيت مدينته). كل موعد تشغيلٌ مستقل بحدّه من الطلبات.
[triggers]
crons = ["0 4 * * *", "5 4 * * *", "15 4 * * *", "0 17 * * *", "*/15 * * * *"]

[vars]
TELEGRAM_CHANNEL = "@daydanquran"
# عنوان هذا الـWorker نفسه، يُسجَّل في تيليجرام كـwebhook عند كل تشغيل مجدول
WEBHOOK_URL = "https://daydan-publisher.mohammadabdalwahed347.workers.dev/telegram/webhook"
TELEGRAM_ENABLED = "1"
PUBLISH_DRY_RUN = "1"
# مفتاح إيقاف التذكيرات. مع PUBLISH_DRY_RUN = "1" لا يصل التذكير إلا إلى ADMIN_CHAT_ID
REMINDERS_ENABLED = "1"
# Meta (إنستغرام وفيسبوك): موقوف حتى موافقة Meta App Review (docs/meta-app-review.md).
# META_DRY_RUN = "1" يبقي Meta في وضع التجربة (تقرير للمشرف فقط) حتى بعد إطفاء PUBLISH_DRY_RUN.
INSTAGRAM_ENABLED = "0"
FACEBOOK_ENABLED = "0"
# الريلز وفيديو الصفحة: موقوفة حتى يُسمح بإعادة نشر التلاوة (docs/09 #2) وتُولَّد ملفات الفيديو
META_VIDEO_ENABLED = "0"
META_DRY_RUN = "1"
FACEBOOK_PAGE_ID = ""
INSTAGRAM_USER_ID = ""
# ADMIN_CHAT_ID و TELEGRAM_BOT_TOKEN و META_ACCESS_TOKEN أسرار: npx wrangler secret put ...

[[kv_namespaces]]
binding = "PUBLICATIONS"
id = "b661ffa2ea7a432eb99d4cbe3490f11a"

[[d1_databases]]
binding = "DB"
database_name = "daydan"
database_id = "02417395-f611-4c24-8cd3-91a51a938149"
migrations_dir = "migrations"
